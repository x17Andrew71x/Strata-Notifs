name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level=moderate

      - name: Audit development dependencies
        run: corepack pnpm audit --audit-level=moderate

      - name: Run PostgreSQL role-attestation integration suite
        run: corepack pnpm --dir server test:db

      - name: Run web shell tests and production build
        run: corepack pnpm --filter @afterchime/web test && corepack pnpm --filter @afterchime/web build

      - name: Run server checks
        run: corepack pnpm --dir server check

      - name: Write server test report
        run: corepack pnpm --dir server test:ci

      - name: Run repository static checks
        run: |
          corepack pnpm privacy:test
          corepack pnpm privacy:check
          corepack pnpm format:check
          corepack pnpm lint

      - name: Verify debug Android lane
        run: >-
          (cd android && ./gradlew --no-daemon --no-configuration-cache
          :app:testDevDebugUnitTest :app:testProdDebugUnitTest
          :app:lintDevDebug :app:assembleDevDebug)

      - name: Assemble hardened internal-review APK
        run: (cd android && ./gradlew --no-daemon :app:assembleDevReview)

      - name: Prove application artifacts exclude the retired feedback wrapper
        run: |
          python3 -m unittest scripts/test_check_dev_feedback_exclusion.py
          python3 -m unittest scripts/test_check_android_production_release.py
          corepack pnpm --filter @afterchime/web build
          NODE_ENV=production DEV_FEEDBACK_ENABLED=false corepack pnpm --filter @afterchime/server build
          if (cd android && ./gradlew --no-daemon --no-configuration-cache :app:verifyProductionReleaseConfiguration); then
            echo "Production release configuration unexpectedly accepted inert defaults." >&2
            exit 1
          fi
          (cd android && ./gradlew --no-daemon --no-configuration-cache :app:assembleProdReview)
          python3 scripts/check_dev_feedback_exclusion.py \
            --web web/dist \
            --server server/dist \
            --migrations server/runtime-migrations \
            --apk android/app/build/outputs/apk/dev/review/app-dev-review.apk \
            --apk android/app/build/outputs/apk/prod/review/app-prod-review.apk

      - name: Upload test reports
        if: >-
          success() &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports
          path: |
            server/reports/junit.xml
            android/app/build/reports/tests/testDevDebugUnitTest/
            android/app/build/reports/lint-results-devDebug.html
          if-no-files-found: error
          retention-days: 7


  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.repository.private == false ||
      github.event.repository.security_and_analysis.advanced_security.status == 'enabled')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
